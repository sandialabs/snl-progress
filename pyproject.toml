[tool.poetry]
name = "snl-progress"
version = "2.0.0"
description = "Used to evaluate the reliability of a power system and size energy storage systems required for maintaining a certain reliability level"
authors = ["Atri Bera <abera@sandia.gov>"]
readme = "README.md"
license = "BSD-3-Clause"
homepage = "https://github.com/sandialabs/snl-progress"
repository = "https://github.com/sandialabs/snl-progress"
documentation = "https://sandialabs.github.io/snl-progress/"
keywords = ["reliability", "power system", "energy storage"]

include = [
    { path = "README.md", format = ["sdist", "wheel"] },
]

packages = [
    { include = "progress" },
]
exclude = [
    "main_app.py",
    "Results/*",
    "start/*",
    "__pycache__/*",
    "docs/*",
    ".readthedocs.yaml",
    "licenses/*"
]

[tool.poetry.scripts]
progress = "progress.__main__:main"

[tool.poetry.dependencies]
python = ">=3.11"
numpy = ">=1.21.0, <2.0.0"
pyomo = "6.7.3"
pandas = "2.2.2"
# mpi4py = "3.1.5"
matplotlib = "3.9.0"
openpyxl = "3.1.4"
seaborn = "0.13.2"
scikit-learn = "1.5.0"
kneed = "0.8.5"
requests = "2.32.4"
pvlib = "0.11.0"
NREL-rex = "0.2.86"
PySide6 = "6.5.2"
PySide6-Addons = "6.5.2"
PySide6-Essentials = "6.5.2"
plotly = "5.24.1"
kaleido = "0.2.1"
Markdown = "3.7"
timezonefinder = ">=8.2.0"
cdsapi = ">=0.7.7"
rainflow = "3.2.0"
pybamm = "26.6.2.0"
"ruamel.yaml" = "0.19.1"
PyYAML = "6.0.3"

[tool.poetry.group.dev.dependencies]
pytest = "*"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
